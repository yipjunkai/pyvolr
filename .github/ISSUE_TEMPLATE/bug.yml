name: Bug report
description: Numerical, behavioral, or build bugs.
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code that reproduces the bug. If numerical, please include the exact `(S, K, T, r, q, sigma)` inputs.
      render: python
      placeholder: |
        from pyvolr import bs
        bs.price("c", S=100, K=100, T=1.0, r=0.05, sigma=0.20)
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected result
      description: Numerical comparisons against a reference (textbook, Wolfram, QuantLib) are extra helpful.
    validations:
      required: true
  - type: input
    id: pyvolr-version
    attributes:
      label: pyvolr version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.12.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 14.5 arm64, Ubuntu 24.04 x86_64
    validations:
      required: true
