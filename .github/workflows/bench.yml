name: bench

on:
  pull_request:
    paths:
      - "crates/**"
      - "python/**"
      - "benches/**"
      - ".github/workflows/bench.yml"
  schedule:
    - cron: "0 5 * * 0"  # weekly Sunday
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv pip install --system maturin pytest pytest-benchmark numpy
          maturin develop --release
      - name: Run benchmarks
        run: |
          if [ -d benches ]; then
            pytest benches --benchmark-only --benchmark-json=bench.json
          else
            echo "::notice::benches/ not yet present; skipping."
          fi
      - name: Upload benchmark result
        if: hashFiles('bench.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench.json
          retention-days: 30
