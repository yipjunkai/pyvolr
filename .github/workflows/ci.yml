name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-rust:
    name: lint (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  lint-python:
    name: lint (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install dev deps
        run: uv pip install --system 'ruff>=0.7' 'pyright>=1.1.380'
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright

  lint-misc:
    name: lint (misc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: actionlint
        run: |
          curl -sL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: taplo
        run: |
          curl -L -o taplo.gz \
            https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz
          gunzip taplo.gz && chmod +x taplo
          ./taplo fmt --check

  test-rust:
    name: test (rust)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo test --workspace
      - run: cargo test --workspace --release

  test-python:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Trim Windows from the older Pythons to keep matrix cost reasonable.
        exclude:
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Build extension and install with test deps
        run: |
          uv pip install --system maturin pytest pytest-benchmark hypothesis
          maturin develop --release
      - name: Run pytest
        run: pytest -ra

  property-tests:
    name: property tests (extended)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Build and install
        run: |
          uv pip install --system maturin pytest hypothesis
          maturin develop --release
      - name: Hypothesis thorough profile
        run: pytest -m property --hypothesis-profile=thorough

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-version in Cargo.toml.
          toolchain: "1.78"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo check --workspace --all-targets
