name: ci

on:
  # No workflow-level paths-ignore on purpose: a skipped workflow never reports
  # its checks, so a docs-only PR would leave the required `ci-passed` context
  # permanently "Expected" and unmergeable (the `main` ruleset has no admin
  # bypass). Instead the `changes` job below decides whether any non-docs file
  # changed and gates the heavy jobs; `ci-passed` still reports either way.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Detects whether the change touches anything outside the docs/meta set.
    # `code` gates the heavy jobs below so a docs-only change skips them yet
    # still reports a green `ci-passed`. This replaces the old workflow-level
    # `paths-ignore` (which skipped the whole workflow and never reported the
    # required check).
    #
    # We match a positive `docs` filter with `predicate-quantifier: every` (true
    # iff EVERY changed file is docs/meta) and invert it, rather than a
    # `['**', '!*.md', …]` exclusion list: dorny/paths-filter ORs its pattern
    # array, so a bare `**` matches every file and the `!` negations never
    # subtract — that made `code` always true and skipped nothing.
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # code = "not a docs-only change": docs is 'true' only when every changed
      # file matched the docs filter, so invert it.
      code: ${{ steps.filter.outputs.docs != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # `every`: the `docs` filter is true only when ALL changed files match
          # one of these globs (a docs-only change). Keep this list in sync with
          # what should NOT trigger the full suite. `*.md` covers root files;
          # `**/*.md` covers nested ones.
          predicate-quantifier: 'every'
          filters: |
            docs:
              - '*.md'
              - '**/*.md'
              - 'docs/**'
              - 'LICENSE*'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/FUNDING.yml'
              - '.github/PULL_REQUEST_TEMPLATE.md'

  lint:
    name: lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
      - name: Install lint + test deps from uv.lock (incl. the project, so pyright resolves pyvolr)
        # --locked also asserts the lockfile is in sync with pyproject.toml,
        # so a stale uv.lock fails the PR here rather than drifting silently.
        #
        # Unlike the test jobs (which `maturin develop` the extension), lint has
        # no build step of its own. Omit --no-install-project so uv builds and
        # installs pyvolr here — pyright needs `import pyvolr` to resolve. This
        # restores the old `uv run pyright` behaviour (which synced the project
        # implicitly) while pinning it to the lockfile.
        run: uv sync --locked --extra dev --extra test
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: pyright
        run: uv run --no-sync pyright
      - name: actionlint
        # Version-pinned and checksum-verified: a tampered release asset
        # fails sha256sum -c instead of running inside the lint gate.
        run: |
          curl -sL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: Install taplo
        # Prebuilt binary, checksum-verified internally against install-action's
        # signed manifests — replaces a hand-maintained curl + sha256 pin.
        # (actionlint above keeps the curl form: install-action doesn't carry it.)
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: taplo@0.10.0
      - name: taplo
        run: taplo fmt --check

  test-rust:
    name: test (rust)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # windows-latest added so `cargo test` (incl. the mpmath golden
        # asserts) runs on MSVC math, not just unix libm — the cross-platform
        # leg the determinism note in normal.rs depends on actually existing.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # pyo3 needs to find a Python interpreter at build time to satisfy
          # the abi3-py310 minimum. extension-module is OFF in cargo test so
          # we link normally against libpython.
          python-version: "3.12"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --workspace
      - run: cargo test --workspace --release

  test-python:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Trim Windows from the older Pythons to keep matrix cost reasonable.
        exclude:
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.11" }
        # One free-threaded leg: the full pytest suite on no-GIL 3.14t, so a
        # core change is FT-tested on every PR (wheel-smoke only covers FT on
        # packaging PRs, and only at release before that). `maturin develop`
        # auto-builds a version-specific cp314t wheel — abi3 isn't available on
        # free-threaded — verified locally that the suite runs clean under no GIL.
        include:
          - { os: ubuntu-latest, python: "3.14t" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked deps and build the extension
        # maturin comes from the dev extra; --no-sync below stops uv run from
        # re-resolving (and re-building the project) on every invocation.
        run: |
          uv sync --locked --extra test --extra dev --no-install-project
          uv run --no-sync maturin develop --release
      - name: Run pytest
        run: uv run --no-sync pytest -ra

  property-tests:
    name: property tests (extended)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
      - name: Install locked deps and build the extension
        run: |
          uv sync --locked --extra test --extra dev --no-install-project
          uv run --no-sync maturin develop --release
      - name: Hypothesis thorough profile
        run: uv run --no-sync pytest -m property --hypothesis-profile=thorough

  msrv:
    name: msrv
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          # Keep in sync with rust-version in Cargo.toml.
          toolchain: "1.83"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo check --workspace --all-targets

  test-numpy-floor:
    name: test (numpy floor)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
      - name: Build, then pin numpy down to the declared floor
        # Proves the numpy>=1.26 floor in pyproject actually works: the lockfile
        # resolves numpy 2.x, so after building we force numpy to the floor and
        # run the suite against it. The abi3 wheel is numpy-version-agnostic at
        # runtime (rust-numpy binds the C-API of whichever numpy is imported), so
        # building under 2.x then testing under 1.26 is a valid floor check. The
        # version assert stops a silent no-op downgrade from testing 2.x by stealth.
        run: |
          uv sync --locked --extra test --extra dev --no-install-project
          uv run --no-sync maturin develop --release
          uv pip install "numpy==1.26.*"
          uv run --no-sync python -c "import numpy; assert numpy.__version__.startswith('1.26'), numpy.__version__; print('numpy floor:', numpy.__version__)"
      - name: Run pytest
        run: uv run --no-sync pytest -ra

  ci-passed:
    # Single check that branch protection can require, instead of listing each
    # matrix entry by name. Succeeds only if all needed jobs succeeded; fails
    # if any failed or was cancelled. Runs even on partial failures because
    # `if: always()` is set. A `skipped` result counts as OK, so a docs-only
    # change (heavy jobs gated out by `changes`) still reports a green
    # `ci-passed` — that's what keeps docs PRs mergeable under the no-bypass
    # ruleset. `changes` itself is in `needs`, so if the filter errors the gate
    # fails instead of waving the change through.
    name: ci-passed
    if: ${{ always() }}
    needs: [changes, lint, test-rust, test-python, property-tests, msrv, test-numpy-floor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate required-job results
        env:
          NEEDS_RESULT: ${{ toJSON(needs) }}
        run: |
          set -e
          echo "$NEEDS_RESULT" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          if echo "$NEEDS_RESULT" | jq -e 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "::error::At least one required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs passed."
