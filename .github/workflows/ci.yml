name: ci

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Install lint + test deps from uv.lock (incl. the project, so pyright resolves pyvolr)
        # --locked also asserts the lockfile is in sync with pyproject.toml,
        # so a stale uv.lock fails the PR here rather than drifting silently.
        #
        # Unlike the test jobs (which `maturin develop` the extension), lint has
        # no build step of its own. Omit --no-install-project so uv builds and
        # installs pyvolr here — pyright needs `import pyvolr` to resolve. This
        # restores the old `uv run pyright` behaviour (which synced the project
        # implicitly) while pinning it to the lockfile.
        run: uv sync --locked --extra dev --extra test
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: pyright
        run: uv run --no-sync pyright
      - name: actionlint
        run: |
          curl -sL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: taplo
        run: |
          curl -sL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz | gunzip > taplo
          chmod +x taplo
          ./taplo fmt --check

  test-rust:
    name: test (rust)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          # pyo3 needs to find a Python interpreter at build time to satisfy
          # the abi3-py310 minimum. extension-module is OFF in cargo test so
          # we link normally against libpython.
          python-version: "3.12"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --workspace
      - run: cargo test --workspace --release

  test-python:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Trim Windows from the older Pythons to keep matrix cost reasonable.
        exclude:
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked deps and build the extension
        # maturin comes from the dev extra; --no-sync below stops uv run from
        # re-resolving (and re-building the project) on every invocation.
        run: |
          uv sync --locked --extra test --extra dev --no-install-project
          uv run --no-sync maturin develop --release
      - name: Run pytest
        run: uv run --no-sync pytest -ra

  property-tests:
    name: property tests (extended)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Install locked deps and build the extension
        run: |
          uv sync --locked --extra test --extra dev --no-install-project
          uv run --no-sync maturin develop --release
      - name: Hypothesis thorough profile
        run: uv run --no-sync pytest -m property --hypothesis-profile=thorough

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          # Keep in sync with rust-version in Cargo.toml.
          toolchain: "1.78"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo check --workspace --all-targets

  ci-passed:
    # Single check that branch protection can require, instead of listing each
    # matrix entry by name. Succeeds only if all needed jobs succeeded; fails
    # if any failed or was cancelled. Runs even on partial failures because
    # `if: always()` is set.
    name: ci-passed
    if: ${{ always() }}
    needs: [lint, test-rust, test-python, property-tests, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required-job results
        env:
          NEEDS_RESULT: ${{ toJSON(needs) }}
        run: |
          set -e
          echo "$NEEDS_RESULT" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          if echo "$NEEDS_RESULT" | jq -e 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "::error::At least one required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs passed."
