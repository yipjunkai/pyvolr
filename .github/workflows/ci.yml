name: ci

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Install Python lint tools
        run: |
          uv venv
          uv pip install 'ruff>=0.15' 'pyright>=1.1.400'
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: actionlint
        run: |
          curl -sL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: taplo
        run: |
          curl -sL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz | gunzip > taplo
          chmod +x taplo
          ./taplo fmt --check

  test-rust:
    name: test (rust)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          # pyo3 needs to find a Python interpreter at build time to satisfy
          # the abi3-py310 minimum. extension-module is OFF in cargo test so
          # we link normally against libpython.
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo test --workspace
      - run: cargo test --workspace --release

  test-python:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Trim Windows from the older Pythons to keep matrix cost reasonable.
        exclude:
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build extension and install with test deps
        run: |
          uv venv
          uv pip install maturin pytest pytest-benchmark hypothesis numpy
          uv run maturin develop --release
      - name: Run pytest
        run: uv run pytest -ra

  property-tests:
    name: property tests (extended)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Build and install
        run: |
          uv venv
          uv pip install maturin pytest hypothesis numpy
          uv run maturin develop --release
      - name: Hypothesis thorough profile
        run: uv run pytest -m property --hypothesis-profile=thorough

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-version in Cargo.toml.
          toolchain: "1.78"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo check --workspace --all-targets

  ci-passed:
    # Single check that branch protection can require, instead of listing each
    # matrix entry by name. Succeeds only if all needed jobs succeeded; fails
    # if any failed or was cancelled. Runs even on partial failures because
    # `if: always()` is set.
    name: ci-passed
    if: ${{ always() }}
    needs: [lint, test-rust, test-python, property-tests, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required-job results
        env:
          NEEDS_RESULT: ${{ toJSON(needs) }}
        run: |
          set -e
          echo "$NEEDS_RESULT" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          if echo "$NEEDS_RESULT" | jq -e 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "::error::At least one required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs passed."
