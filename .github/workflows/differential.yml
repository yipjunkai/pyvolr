name: differential

# Run against py_vollib on a Python 3.10 sidecar to catch numerical drift.
# py_vollib is unmaintained and only imports reliably on Python <= 3.10.

on:
  schedule:
    - cron: "0 6 * * *"  # daily 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "python/pyvolr/bs.py"
      - "python/pyvolr/compat/**"
      - "tests/differential/**"

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    continue-on-error: true  # the upstream may bitrot completely; treat as informational
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v3
      - name: Install pyvolr and py_vollib (3.10 sidecar)
        run: |
          uv pip install --system maturin pytest numpy
          maturin develop --release
          # py_vollib's _testcapi import works on 3.10 builds with the test module bundled.
          uv pip install --system py_vollib py_vollib_vectorized || \
            echo "::warning::py_vollib install failed; differential test will fall back to golden CSV."
      - name: Run differential tests
        env:
          PYVOLR_DIFFERENTIAL: "1"
        run: |
          if [ -d tests/differential ]; then
            pytest tests/differential -ra
          else
            echo "::notice::tests/differential not yet present; skipping."
          fi
