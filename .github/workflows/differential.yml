name: differential

# Compares pyvolr's compat shims to their references across a grid of inputs —
# the gate behind the "matches py_vollib" and "matches py_vollib_vectorized"
# claims. Invoked as a release gate (release.yml calls it via workflow_call
# before publishing wheels) and on demand (workflow_dispatch). Neither reference
# imports on Python 3.12+ (the _testcapi bug — see docs/why.md;
# py_vollib_vectorized depends on py_vollib), so this runs on a 3.10 sidecar.
#
# The two differentials run in SEPARATE pytest processes: importing
# py_vollib_vectorized monkeypatches py_vollib module-globally, which must not
# leak into the py_vollib differential.
#
# No schedule: pyvolr's outputs only move on our own commits and both references
# are abandoned (frozen), so a nightly run just recomputed an identical result.
# The signal that matters — "are we about to publish something that no longer
# matches?" — is the release gate, not the clock.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: differential-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    name: differential vs py_vollib + py_vollib_vectorized
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.10"
      - name: Build pyvolr and install test deps
        run: |
          uv venv
          uv pip install maturin pytest hypothesis numpy py_vollib py_vollib_vectorized
          uv run maturin develop --release
      - name: Patch py_lets_be_rational for missing _testcapi
        # uv-managed Pythons (and many production Python distributions) don't
        # ship CPython's internal _testcapi module — see docs/why.md. The
        # two-line patch swaps it for sys.float_info, which is where these
        # values should have been read from in the first place. We locate the
        # file via filesystem search (NOT by importing the module, which
        # triggers the very ImportError we are trying to fix).
        run: |
          CONST=$(find .venv -path '*/py_lets_be_rational/constants.py' -print -quit)
          test -n "$CONST" || { echo "py_lets_be_rational/constants.py not found"; exit 1; }
          sed -i 's|from _testcapi import DBL_MIN, DBL_MAX|from sys import float_info as _fi; DBL_MIN, DBL_MAX = _fi.min, _fi.max|' "$CONST"
          grep -q "float_info" "$CONST" || { echo "patch did not apply"; exit 1; }
      - name: Run differential (py_vollib)
        # Runs everything marked `differential` EXCEPT the py_vollib_vectorized
        # file, which must run in its own process (see below).
        run: uv run pytest -m differential --ignore=tests/test_differential_vectorized.py -ra
      - name: Run differential (py_vollib_vectorized)
        # Separate process: importing py_vollib_vectorized monkeypatches py_vollib
        # module-globally, which must not leak into the py_vollib differential.
        run: uv run pytest tests/test_differential_vectorized.py -ra
