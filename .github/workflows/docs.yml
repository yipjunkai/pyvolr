name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "python/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # mike needs full history
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Install docs deps
        run: |
          uv pip install --system --break-system-packages mkdocs mkdocs-material 'mkdocstrings[python]' mike
      - name: Build docs (skipped if no mkdocs.yml yet)
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build --strict
          else
            echo "::notice::mkdocs.yml not present yet; docs build skipped."
            mkdir -p site && echo "<h1>pyvolr docs coming soon</h1>" > site/index.html
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
