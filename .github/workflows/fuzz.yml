name: fuzz

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/core/src/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [bsm_price, iv_solve, black76_price, greeks_all, black76_greeks_all]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # pyo3 (transitively required via pyvolr-core) needs a Python
          # interpreter on PATH satisfying abi3-py310 at build time.
          python-version: "3.12"
      - name: Install the pinned nightly from fuzz/rust-toolchain.toml
        # Single source of truth for the dated-nightly pin: rustup reads the
        # channel from the toolchain file, so a bump is a one-line change
        # there and nothing in this workflow needs to stay in sync.
        run: rustup toolchain install
        working-directory: fuzz
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        # Prebuilt, checksum-verified binary — the previous `cargo install`
        # compiled it from source on every run.
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Restore evolved corpus
        # The run_id-suffixed key never hits exactly, so the post-step always
        # saves this run's evolved corpus; restore-keys pulls the newest prior
        # one. Coverage therefore compounds across scheduled runs instead of
        # restarting from scratch (the audit's empty-corpus finding).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - name: Verify fuzz/Cargo.lock is in sync
        # `cargo fuzz run` has no --locked passthrough (cargo-fuzz only forwards
        # -Z via unstable_flags), so we enforce the committed lock here instead:
        # `cargo fetch --locked` errors if the lockfile would need updating, and
        # warms the dependency cache for the build below. Dependabot (/fuzz entry)
        # is the mover that keeps these pins fresh; release-please re-syncs the
        # pyvolr-core path entry so this check stays green across releases.
        run: cargo fetch --locked
        working-directory: fuzz
      - name: Fuzz ${{ matrix.target }}
        # PR runs: 60s smoke per target.  Nightly/manual: 300s per target.
        #
        # Two corpus dirs: corpus/<target> is the evolving working set (cache-
        # restored above, written to by libFuzzer); seeds/<target> is the
        # committed, cmin-minimized baseline read in on every run, so even a
        # cold-cache run starts from known coverage instead of from nothing.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DURATION=60
          else
            DURATION=300
          fi
          mkdir -p corpus/${{ matrix.target }}
          # --target pinned to the runner's host triple: install-action ships
          # cargo-fuzz as a static MUSL binary, and cargo-fuzz defaults the
          # build target to its own compile target — i.e. musl, where ASAN +
          # statically-linked libc is unsupported ("sanitizer is incompatible
          # with statically linked libc").
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} corpus/${{ matrix.target }} seeds/${{ matrix.target }} -- -max_total_time=$DURATION
        working-directory: fuzz
      - name: Upload crashes (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30

  alert:
    name: file tracking issue
    needs: [fuzz]
    # The nightly run is the only unattended fuzz trigger — a crash found at
    # 03:00 must not sit silently in the Actions tab. A scheduled failure
    # files (or refreshes) the tracking issue; a scheduled success closes it,
    # so the issue exists exactly while the fuzz lane is red. PR and dispatch
    # runs never touch issues (a human is watching those).
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Sync the fuzz-crash issue to the run result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          existing=$(gh issue list --label fuzz-crash --state open \
            --json number --jq '.[0].number // empty')
          if [ "$FUZZ_RESULT" = "failure" ]; then
            gh label create fuzz-crash --color B60205 \
              --description "Scheduled fuzz run is failing" --force
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Nightly fuzz still failing: $RUN_URL"
            else
              gh issue create --title "Nightly fuzz run failed — possible crash found" \
                --label fuzz-crash \
                --body "A scheduled fuzz target failed. If it is a real crash, the reproducing input is attached to the run as a \`fuzz-crashes-<target>\` artifact (30-day retention) — minimize and fix, then this issue closes itself on the next green night. Run: $RUN_URL"
            fi
          elif [ "$FUZZ_RESULT" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "Resolved — the nightly fuzz run is green again: $RUN_URL"
            fi
          fi
