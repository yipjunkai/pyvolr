name: release-please

# Maintains a permanent "Release v0.X.Y" PR with auto-generated changelog
# from conventional commits. Merging the PR creates the version tag, which
# fires release.yml. Releases become a one-click operation.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
