name: release

# Builds and publishes wheels on tag push (e.g. v0.1.0). Tags are normally
# created by release-please.yml when a Release PR is merged.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build wheels but do not publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-sdist:
    name: build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          uv venv
          uv pip install maturin
          uv run maturin sdist --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  build-wheels:
    name: wheels (${{ matrix.platform.runner }} / ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # cibw entries cover both abi3 builds (cp310-* picks up everything 3.10+ as a single
          # stable-ABI wheel) and per-version free-threaded builds (cp313t-* / cp314t-*).
          - { runner: ubuntu-latest,    target: x86_64,  cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp313t-* cp314t-*" }
          - { runner: ubuntu-24.04-arm, target: aarch64, cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp313t-* cp314t-*" }
          - { runner: macos-13,         target: x86_64,  cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp313t-* cp314t-*" }
          - { runner: macos-14,         target: aarch64, cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp313t-* cp314t-*" }
          - { runner: windows-latest,   target: x86_64,  cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp313t-* cp314t-*" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.platform.cibw }}
          CIBW_SKIP: "pp*"
          # Enable free-threaded CPython 3.13t builds (cp314t is enabled by default in v3.4+).
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "build"
          # Build envs in cibuildwheel v3 no longer pre-install setuptools/wheel; we still need
          # maturin explicitly as the build backend.
          CIBW_BEFORE_BUILD: "pip install maturin"
          CIBW_TEST_REQUIRES: "pytest hypothesis numpy"
          CIBW_TEST_COMMAND: "pytest {project}/tests -ra"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: wheelhouse/*.whl
          retention-days: 7

  publish-pypi:
    name: publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pyvolr
    permissions:
      id-token: write  # Required for Trusted Publishing (OIDC).
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          print-hash: true

  publish-crates-io:
    name: publish to crates.io
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: crates-io
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # NOTE: once crates.io Trusted Publishing is stable, replace the
          # CARGO_REGISTRY_TOKEN secret with an OIDC-acquired token.
          cargo publish -p pyvolr-core --no-verify

  create-release:
    name: create github release
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
