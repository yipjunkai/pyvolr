name: release

# Builds and publishes wheels on tag push (e.g. v0.1.0). Tags are normally
# created by release-please.yml when a Release PR is merged.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build wheels but do not publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-sdist:
    name: build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          uv sync --locked --extra dev --no-install-project
          uv run --no-sync maturin sdist --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  build-wheels:
    name: wheels (${{ matrix.platform.runner }} / ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # cibw entries cover both abi3 builds (cp310-* picks up everything 3.10+ as a single
          # stable-ABI wheel) and per-version free-threaded builds (cp313t-* / cp314t-*).
          #
          # macOS: macos-14 (Apple Silicon) builds BOTH x86_64 (cross-compiled via Apple SDK)
          # and arm64 (native).  This avoids the dying macos-13 (Intel) runner pool, which has
          # become unreliable for queue times.
          - { runner: ubuntu-latest,    target: x86_64,         cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp313t-* cp314t-*", archs: "auto" }
          - { runner: ubuntu-24.04-arm, target: aarch64,        cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp313t-* cp314t-*", archs: "auto" }
          - { runner: macos-14,         target: x86_64+aarch64, cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp313t-* cp314t-*", archs: "x86_64 arm64" }
          - { runner: windows-latest,   target: x86_64,         cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp313t-* cp314t-*", archs: "auto" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Add x86_64-apple-darwin Rust target (macOS only)
        if: matrix.platform.runner == 'macos-14'
        run: rustup target add x86_64-apple-darwin
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Export locked test deps for in-wheel verification
        # The export carries environment markers (numpy is forked 2.2.x/2.4.x
        # across Python versions) and hashes, so the same file pins every
        # selector in the matrix and pip runs in hash-checking mode.
        shell: bash
        run: uv export --locked --extra test --no-emit-project --output-file requirements-wheel-test.txt
      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.platform.cibw }}
          CIBW_ARCHS: ${{ matrix.platform.archs }}
          # macos-14 runner is arm64. cibuildwheel CAN build x86_64 wheels there
          # via Apple's cross-build SDK, but the resulting binary can't be exec'd
          # on the arm64 runner to run pytest. Skip testing x86_64 macOS wheels
          # only; Linux/Windows are native-arch and tests run normally.
          CIBW_TEST_SKIP: "*-macosx_x86_64"
          # MACOSX_DEPLOYMENT_TARGET: cibuildwheel's default of 10.9 conflicts
          # with rustc's minimum of 10.12 — built binaries target 10.12+ but
          # delocate then rejects the wheel because the manifest says 10.9.
          # 10.13 (High Sierra, 2017) is the modern floor; safe for all users.
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=10.13"
          # Required to opt into building free-threaded CPython wheels (cp313t-*,
          # cp314t-*). The flag is marked deprecated in cibuildwheel v3.4 but is
          # still functionally required — removing it makes CIBW_BUILD selectors
          # for those Python versions error out as "Invalid build selector".
          # Revisit once cibuildwheel v4 enables free-threading by default.
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "build"
          # Linux wheels build inside manylinux containers that don't have Rust.
          # Install rustup per-container with `--profile minimal --default-toolchain stable`
          # and put cargo on PATH so maturin can find it. macOS/Windows use host runners
          # (which already have Rust via dtolnay/rust-toolchain above), so this is Linux-only.
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal"
          # RUSTUP_TOOLCHAIN=stable forces rustup to ignore the project's
          # rust-toolchain.toml during wheel builds.  Without it, rustup tries
          # to install rustfmt + clippy (declared in rust-toolchain.toml for
          # devs) inside the container — and the manylinux x86_64 image
          # carries a stale `bin/cargo-fmt` that triggers a conflict error.
          # Lint runs on the host runner via dtolnay/rust-toolchain, so the
          # components are still available where needed.
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" RUSTUP_TOOLCHAIN=stable'
          # Build envs in cibuildwheel v3 no longer pre-install setuptools/wheel; we still need
          # maturin explicitly as the build backend.
          CIBW_BEFORE_BUILD: "pip install maturin"
          # Test deps come from uv.lock (exported above) instead of floating
          # `pip install pytest ...`, so wheel verification at tag time cannot
          # be broken — or subverted — by an upstream release that day.
          CIBW_BEFORE_TEST: "pip install -r {project}/requirements-wheel-test.txt"
          CIBW_TEST_COMMAND: "pytest {project}/tests -ra"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: wheelhouse/*.whl
          retention-days: 7

  publish-pypi:
    name: publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pyvolr
    permissions:
      id-token: write  # Required for Trusted Publishing (OIDC).
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true
          print-hash: true

  create-release:
    name: create github release
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          generate_release_notes: true
          files: dist/*
