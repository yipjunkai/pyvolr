name: release

# Builds and publishes wheels on tag push (e.g. v0.1.0). Tags are normally
# created by release-please.yml when a Release PR is merged.

on:
  push:
    tags:
      - "v*"
  # A dispatch run IS the release dry-run: it builds the sdist and every wheel
  # and runs the differential gate, but publish-pypi and create-release are
  # tag-push-gated (`github.event_name == 'push'`), so nothing is published.
  # Use it to validate packaging changes (e.g. a cibuildwheel major) pre-tag.
  workflow_dispatch:

permissions:
  contents: read

# Serialize the whole release pipeline: a re-run or a rapid second tag queues
# behind the in-flight run instead of racing it to PyPI. No cancel-in-progress
# — never kill a half-done publish.
concurrency:
  group: release

jobs:
  build-sdist:
    name: build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          uv sync --locked --extra dev --no-install-project
          uv run --no-sync maturin sdist --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  build-wheels:
    name: wheels (${{ matrix.platform.runner }} / ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          # cibw entries cover both abi3 builds (cp310-* picks up everything 3.10+ as a single
          # stable-ABI wheel) and the free-threaded build (cp314t-*). No cp313t-*: cibuildwheel
          # 4.x removed Python 3.13 free-threading support entirely ("Invalid build selector:
          # 'cp313t-*'" — the 2026-06 dry-run); 3.13t wheels were last published at 0.1.3.
          #
          # macOS: macos-14 (Apple Silicon) builds BOTH x86_64 (cross-compiled via Apple SDK)
          # and arm64 (native).  This avoids the dying macos-13 (Intel) runner pool, which has
          # become unreliable for queue times.
          - { runner: ubuntu-latest,    target: x86_64,         cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*", archs: "auto" }
          - { runner: ubuntu-24.04-arm, target: aarch64,        cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*", archs: "auto" }
          - { runner: macos-14,         target: x86_64+aarch64, cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*", archs: "x86_64 arm64" }
          - { runner: windows-latest,   target: x86_64,         cibw: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*", archs: "auto" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Add x86_64-apple-darwin Rust target (macOS only)
        if: matrix.platform.runner == 'macos-14'
        run: rustup target add x86_64-apple-darwin
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Export locked test deps for in-wheel verification
        # The export carries environment markers (numpy is forked 2.2.x/2.4.x
        # across Python versions) and hashes, so the same file pins every
        # selector in the matrix and pip runs in hash-checking mode.
        shell: bash
        run: uv export --locked --extra test --no-emit-project --output-file requirements-wheel-test.txt
      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.platform.cibw }}
          CIBW_ARCHS: ${{ matrix.platform.archs }}
          # macos-14 runner is arm64. cibuildwheel CAN build x86_64 wheels there
          # via Apple's cross-build SDK, but the resulting binary can't be exec'd
          # on the arm64 runner to run pytest. Skip testing x86_64 macOS wheels
          # only; Linux/Windows are native-arch and tests run normally.
          #
          # *-win32: the in-wheel test installs the `test` extra, which since
          # 0.1.5 includes pandas (soft dep for return_as="dataframe"). pandas
          # ships no 32-bit Windows wheel, so the test-deps install can't resolve
          # there (pip source-builds it and fails on the missing Python.h). The
          # win32 wheel still builds + passes abi3audit and is core-functional
          # (numpy has win32 wheels); only its in-wheel pytest is skipped.
          CIBW_TEST_SKIP: "*-macosx_x86_64 *-win32"
          # MACOSX_DEPLOYMENT_TARGET: cibuildwheel's default of 10.9 conflicts
          # with rustc's minimum of 10.12 — built binaries target 10.12+ but
          # delocate then rejects the wheel because the manifest says 10.9.
          # 10.13 (High Sierra, 2017) is the modern floor; safe for all users.
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=10.13"
          # The free-threaded CPython wheel (cp314t-*) needs no opt-in under
          # cibuildwheel v4: the v3 `CIBW_ENABLE: cpython-freethreading` group
          # was REMOVED in v4 (free-threading is on by default for 3.14t+) and
          # setting it now fails with "Unknown enable group" — the 2026-06
          # release dry-run caught exactly that on all four platforms.
          CIBW_BUILD_FRONTEND: "build"
          # Linux wheels build inside manylinux containers that don't have Rust.
          # Install rustup per-container with `--profile minimal --default-toolchain stable`
          # and put cargo on PATH so maturin can find it. macOS/Windows use host runners
          # (which already have Rust via dtolnay/rust-toolchain above), so this is Linux-only.
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal"
          # RUSTUP_TOOLCHAIN=stable forces rustup to ignore the project's
          # rust-toolchain.toml during wheel builds.  Without it, rustup tries
          # to install rustfmt + clippy (declared in rust-toolchain.toml for
          # devs) inside the container — and the manylinux x86_64 image
          # carries a stale `bin/cargo-fmt` that triggers a conflict error.
          # Lint runs on the host runner via dtolnay/rust-toolchain, so the
          # components are still available where needed.
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" RUSTUP_TOOLCHAIN=stable'
          # Build envs in cibuildwheel v3 no longer pre-install setuptools/wheel;
          # install maturin explicitly, pinned to the exact version in uv.lock.
          # The authoritative backend pin is pyproject's [build-system].requires
          # (also ==1.13.3), resolved inside build isolation; pinning here too
          # keeps the build env in lockstep so no floating maturin can feed a
          # published wheel. Bump all three together when uv.lock's maturin moves.
          CIBW_BEFORE_BUILD: "pip install maturin==1.13.3"
          # Test deps come from uv.lock (exported above) instead of floating
          # `pip install pytest ...`, so wheel verification at tag time cannot
          # be broken — or subverted — by an upstream release that day.
          CIBW_BEFORE_TEST: "pip install -r {project}/requirements-wheel-test.txt"
          CIBW_TEST_COMMAND: "pytest {project}/tests -ra"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: wheelhouse/*.whl
          retention-days: 7

  # Gate the publish on the py_vollib differential: the 20,448-case "matches
  # reference" claim must hold before any wheel reaches PyPI. Runs in parallel
  # with the wheel builds; publish-pypi needs all three.
  differential:
    name: differential vs py_vollib
    uses: ./.github/workflows/differential.yml

  publish-pypi:
    name: publish to PyPI
    needs: [build-sdist, build-wheels, differential]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pyvolr
    permissions:
      id-token: write  # Required for Trusted Publishing (OIDC).
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
          print-hash: true

  create-release:
    name: create github release
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write      # create the release and upload assets (covers attest's contents:read)
      id-token: write      # mint the OIDC token for keyless Sigstore signing
      attestations: write  # persist the provenance to the GitHub attestations API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      # SLSA build provenance over the exact bytes about to be released. The
      # attestation is recorded in the attestations API — end users can run
      # `gh attestation verify <file> --repo ${{ github.repository }}` — and the
      # Sigstore bundle is attached to the release below. create-storage-record
      # is off: its default (true) needs an `artifact-metadata: write` scope that
      # isn't GA, and the record is only a preview indexing feature we don't use.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
          create-storage-record: false
      # Attach the Sigstore bundle as a release asset. OpenSSF Scorecard's
      # Signed-Releases check inspects release assets by filename suffix only, so
      # a *.sigstore.json asset marks the release signed. Copy AFTER attesting so
      # the bundle is not itself a subject of the attestation.
      - name: Stage attestation bundle as a release asset
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "dist/pyvolr-${GITHUB_REF_NAME}.sigstore.json"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: dist/*
