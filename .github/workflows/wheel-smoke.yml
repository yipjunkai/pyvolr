name: wheel-smoke

# Builds ONE production wheel — the linux x86_64 abi3 wheel, the same build
# release.yml runs at tag time — and runs the in-wheel test suite, on PRs that
# touch packaging. Wheels are otherwise first built at tag time, after the tag
# and release already exist; this is the pre-tag canary for packaging breaks
# (maturin config, cibuildwheel majors, abi3 issues). Advisory: deliberately
# not part of the ci-passed aggregate.
#
# The CIBW_* environment below MIRRORS release.yml's build-wheels job (linux
# leg). If you change one, change both.

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "Cargo.toml"
      - "crates/core/Cargo.toml"
      - ".github/workflows/release.yml"
      - ".github/workflows/wheel-smoke.yml"
  workflow_dispatch:

concurrency:
  group: wheel-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: linux abi3 wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Export locked test deps for in-wheel verification
        run: uv export --locked --extra test --no-emit-project --output-file requirements-wheel-test.txt
      - name: Build + test the abi3 + free-threaded wheels with cibuildwheel
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          # Two build IDs: the abi3 wheel that serves every GIL CPython >= 3.10,
          # plus one free-threaded build. The t-selector keeps the smoke covering
          # the same selector classes as release.yml's matrix — a cibuildwheel
          # major that changes free-threading opt-in semantics (v4 removed the
          # v3 CIBW_ENABLE group; the 2026-06 dry-run failed on all four
          # platforms) now breaks here, on the PR, instead of at tag time. The
          # in-wheel pytest also gives 3.14t its only pre-release test exercise.
          CIBW_BUILD: "cp310-manylinux_x86_64 cp314t-manylinux_x86_64"
          CIBW_BUILD_FRONTEND: "build"
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" RUSTUP_TOOLCHAIN=stable'
          CIBW_BEFORE_BUILD: "pip install maturin"
          CIBW_BEFORE_TEST: "pip install -r {project}/requirements-wheel-test.txt"
          CIBW_TEST_COMMAND: "pytest {project}/tests -ra"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-smoke
          path: wheelhouse/*.whl
          retention-days: 3
