[workspace]
members = ["crates/core"]
resolver = "2"

[workspace.package]
# version intentionally NOT inherited: each crate carries its own literal
# [package].version so release-please can update it via the standard Rust
# strategy. Workspace inheritance for version is incompatible with
# release-please-action v4 + release-type=rust.
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yipjunkai/pyvolr"
homepage = "https://github.com/yipjunkai/pyvolr"
authors = ["pyvolr contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Numerical code routinely mixes f64 / u32 / usize; the casts are intentional.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# PyO3 / numpy idioms that clippy::pedantic does not understand.
needless_pass_by_value = "allow" # PyReadonlyArray is small and passed by value by convention.
useless_conversion = "allow"     # The `?` on `as_slice()?` converts a real error type.
similar_names = "allow"          # s, k, t, r, q, sigma are domain-standard names.
# Stylistic noise.
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_arguments = "allow"      # BSM intrinsically takes 6-7 scalars.
many_single_char_names = "allow"  # Same reason.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# abort, not unwind: production paths are written panic-free on the documented
# FFI contract (no unwrap/expect; slice indexing only over lengths the wrapper
# layer equalizes), so unwind tables would buy no recovery — only binary size
# and landing-pad overhead on the hot path. The accepted tradeoff: a latent
# panic ABORTS the host interpreter instead of becoming a catchable Python
# exception (PyO3 can only translate panics under unwind). SECURITY.md treats
# such crash-propagating panics as in-scope reportable bugs.
panic = "abort"
strip = "symbols"
