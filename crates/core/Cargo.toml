[package]
name = "pyvolr-core"
description = "Rust core for pyvolr: Black-Scholes-Merton pricing, Greeks, and implied volatility."
version = "0.1.5"                                                                                   # release-please-managed; do not edit manually
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"

[lib]
# Default name "pyvolr_core" (from package name). Maturin renames the built
# artifact to "_core" at install time per `[tool.maturin].module-name =
# "pyvolr._core"` in pyproject.toml, so the Python import path stays unchanged.
# Keeping the default lib name lets fuzz/ and other dependents `use pyvolr_core`.
crate-type = ["cdylib", "rlib"]

[dependencies]
# `extension-module` is intentionally NOT in the unconditional feature set:
# enabling it tells pyo3 to skip linking libpython and expect Python to provide
# symbols at runtime (correct for wheel builds, broken for `cargo test`).
# Wheel builds opt in via `[tool.maturin].features = ["extension-module"]` in
# pyproject.toml. `cargo test` runs without it and links against a real Python.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"
libm = "0.2"
# Vectorised IV (n >= PARALLEL_THRESHOLD) and bundled-Greeks (n >=
# GREEKS_PARALLEL_THRESHOLD) dispatch uses rayon's global thread pool;
# small calls stay serial to avoid pool spin-up overhead. Pool size
# follows `RAYON_NUM_THREADS` (set to `1` to opt out of parallelism
# entirely). See `lib.rs` for the threshold constants and rationale.
rayon = "1.10"
# ndarray is pulled in transitively by numpy and managed at numpy's chosen
# version. Adding it directly here is only necessary when we use ndarray::Array,
# ArrayView, etc. in Rust source.

[features]
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name = "pricing"
harness = false

# Decision-record experiment harness (F2/F4/F5) — run locally when
# re-evaluating a rejected alternative; the CI perf-gate runs `--bench
# pricing` only.
[[bench]]
name = "experiments"
harness = false

[lints]
workspace = true
