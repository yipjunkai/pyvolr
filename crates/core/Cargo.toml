[package]
name = "pyvolr-core"
description = "Rust core for pyvolr: Black-Scholes-Merton pricing, Greeks, and implied volatility."
version = "0.1.1"                                                                                   # release-please-managed; do not edit manually
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"

[lib]
# Default name "pyvolr_core" (from package name). Maturin renames the built
# artifact to "_core" at install time per `[tool.maturin].module-name =
# "pyvolr._core"` in pyproject.toml, so the Python import path stays unchanged.
# Keeping the default lib name lets fuzz/ and other dependents `use pyvolr_core`.
crate-type = ["cdylib", "rlib"]

[dependencies]
# `extension-module` is intentionally NOT in the unconditional feature set:
# enabling it tells pyo3 to skip linking libpython and expect Python to provide
# symbols at runtime (correct for wheel builds, broken for `cargo test`).
# Wheel builds opt in via `[tool.maturin].features = ["extension-module"]` in
# pyproject.toml. `cargo test` runs without it and links against a real Python.
pyo3 = { version = "0.28", features = ["abi3-py310"] }
numpy = "0.28"
libm = "0.2"
# ndarray is pulled in transitively by numpy and managed at numpy's chosen
# version. Adding it directly here is only necessary when we use ndarray::Array,
# ArrayView, etc. in Rust source.

[features]
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
approx = "0.5"

[lints]
workspace = true
