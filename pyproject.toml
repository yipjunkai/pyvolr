[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "pyvolr"
description = "Modern Black-Scholes-Merton pricing, Greeks, and implied volatility for Python. Rust core. Drop-in py_vollib replacement."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.10"
authors = [{ name = "pyvolr contributors" }]
keywords = [
  "black-scholes",
  "black-scholes-merton",
  "implied-volatility",
  "options",
  "greeks",
  "quantitative-finance",
  "py_vollib",
  "vollib",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = ["numpy>=2.0"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/yipjunkai/pyvolr"
Repository = "https://github.com/yipjunkai/pyvolr"
Issues = "https://github.com/yipjunkai/pyvolr/issues"
Changelog = "https://github.com/yipjunkai/pyvolr/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=9.0", "pytest-benchmark>=5.0", "hypothesis>=6.150"]
dev = ["maturin>=1.13", "ruff>=0.15", "pyright>=1.1.400", "pre-commit>=4.0"]

# CI-only tooling (PEP 735 groups -- not package extras, never ships in
# metadata). Declared here so the exact version lives in uv.lock and
# Dependabot's uv ecosystem keeps it moving; workflows install it with
# `uv sync --only-group <name>` instead of a hand-pinned `pip install x==`.
[dependency-groups]
audit = ["pip-audit>=2.10"]

[tool.maturin]
module-name = "pyvolr._core"
python-source = "python"
manifest-path = "crates/core/Cargo.toml"
# Wheel builds enable `extension-module` via the crate's local feature, which
# in turn flips `pyo3/extension-module`. `cargo test` does not enable it.
features = ["extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "property: property-based tests (Hypothesis)",
  "differential: differential tests against py_vollib",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",    # pycodestyle + pyflakes
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "RUF",  # ruff-specific
  "NPY",  # numpy
  "PT",   # pytest style
  "TCH",  # type-checking
  "PIE",  # misc
  "FURB", # modernize
]
ignore = [
  "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"python/pyvolr/compat/**" = ["A", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["python", "tests", ".github/scripts"]
exclude = ["**/__pycache__", "target", "dist", ".venv"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

# Tests are verified by running them; pytest's loosely-typed helpers
# (pytest.approx, parametrize lambdas) generate noise under strict mode that
# does not reflect real bugs. Library code under python/ remains strict.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportMissingParameterType = false
reportArgumentType = false
